services:
  qa-auditor:
    build:
      context: .
    ports:
      - "3000:3000"
    env_file:
      - .env
extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./templates:/app/templates:ro
    environment:
      NODE_ENV: production
      PORT: 3000
      DEPLOYMENT_NAMESPACE: ${DEPLOYMENT_NAMESPACE:-development}
      AI_CACHE_TTL_MS: 21600000
      AI_CACHE_MAX_ENTRIES: 100
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
